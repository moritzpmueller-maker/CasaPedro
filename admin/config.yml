# ─────────────────────────────────────────────────────────────────────────────
# Sveltia CMS – Casa Pedro
# Backend: GitHub via DecapBridge (Pedro braucht keinen GitHub-Account)
#
# NACH dem GitHub-Setup: "GITHUB_USERNAME" durch den echten GitHub-Nutzernamen
# ersetzen (z. B. pedro-mueller).
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: git-gateway
  repo: moritzpmueller-maker/CasaPedro
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/3581b210-9f53-4f9b-a0b3-7677d6846335/pkce
  auth_token_endpoint: /sites/3581b210-9f53-4f9b-a0b3-7677d6846335/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://casa-pedro.de

locale: de
media_folder: images
public_folder: /images

# ─────────────────────────────────────────────────────────────────────────────
collections:
  - name: einstellungen
    label: "Website-Inhalte"
    files:

      # ── Hauptdatei ──────────────────────────────────────────────────────────
      - name: content
        label: "Alle Inhalte bearbeiten"
        file: content.json
        format: json
        fields:

          # ── Öffnungszeiten ─────────────────────────────────────────────────
          - label: "Öffnungszeiten"
            name: oeffnungszeiten
            widget: object
            fields:
              - label: "Zeilen"
                name: zeilen
                widget: list
                label_singular: "Zeile"
                fields:
                  - { label: "Tage (z. B. Montag – Samstag)", name: tage,    widget: string }
                  - { label: "Uhrzeit (z. B. 17:00 – 23:00)", name: uhrzeit, widget: string }
              - label: "Feiertags-Hinweis"
                name: hinweis
                widget: string

          # ── Tagesspecials ──────────────────────────────────────────────────
          - label: "Tagesspecials (Speisekarte)"
            name: specials
            widget: object
            fields:
              - label: "Specials anzeigen?"
                name: aktiv
                widget: boolean
                default: false
                hint: "Einschalten, um die Specials-Sektion oben auf der Speisekarte anzuzeigen."
              - label: "Einträge"
                name: eintraege
                widget: list
                label_singular: "Special"
                fields:
                  - { label: "Gerichtname",   name: name,         widget: string }
                  - { label: "Beschreibung",  name: beschreibung, widget: string, required: false }
                  - { label: "Preis (z. B. 12,50)", name: preis,  widget: string }

          # ── Event-Banner ───────────────────────────────────────────────────
          - label: "Event-Banner (Startseite)"
            name: event_banner
            widget: object
            fields:
              - label: "Banner anzeigen?"
                name: aktiv
                widget: boolean
                default: false
                hint: "Einschalten, um den Banner unter dem Hero-Bild anzuzeigen."
              - { label: "Bannertext",  name: text,      widget: string,  required: false }
              - { label: "Link-URL",    name: link_url,  widget: string,  required: false, hint: "Optional – leer lassen wenn kein Link gewünscht." }
              - { label: "Link-Text",   name: link_text, widget: string,  required: false, hint: "z. B. «Mehr erfahren»" }

          # ── Speisekarte ────────────────────────────────────────────────────
          # Die Reihenfolge der Sektionen und Einträge ist die Reihenfolge auf
          # der Website. Das Sprungmenü am linken Rand entsteht automatisch aus
          # den Sektionen, es muss nirgends zusätzlich gepflegt werden.
          - label: "Speisekarte"
            name: speisekarte
            label_singular: "Sektion"
            widget: list
            collapsed: true
            summary: "{{fields.nav_label}}  ·  {{fields.titel_es}}"
            hint: "Sektionen lassen sich per Drag-and-drop umsortieren, hinzufügen und löschen."
            fields:
              - label: "Kurzname für den Link"
                name: id
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Nur Kleinbuchstaben, Ziffern und Bindestriche, keine Leerzeichen und keine Umlaute.']
                hint: "Technischer Name für den Sprunglink, z. B. ensaladas oder kalte-vorspeisen. Muss in jeder Sektion anders sein."
              - { label: "Überschrift spanisch", name: titel_es, widget: string, required: false }
              - { label: "Überschrift deutsch",  name: titel_de, widget: string, required: false }
              - { label: "Überschrift englisch", name: titel_en, widget: string, required: false }
              - label: "Bezeichnung im Sprungmenü"
                name: nav_label
                widget: string
                hint: "Kurz halten, erscheint links neben der Karte."
              - label: "Darstellung"
                name: layout
                widget: select
                default: einspaltig
                options:
                  - { label: "Einspaltig – Speisen und Weine", value: einspaltig }
                  - { label: "Zweispaltig – Getränkekarte",    value: zweispaltig }
              - label: "Einträge"
                name: eintraege
                label_singular: "Eintrag"
                widget: list
                collapsed: true
                typeKey: typ
                types:

                  # ── Gericht ──────────────────────────────────────────────
                  - label: "Gericht"
                    name: gericht
                    summary: "{{fields.name}}  ·  {{fields.preis}} €"
                    fields:
                      - { label: "Name (spanisch)", name: name, widget: string }
                      - { label: "Beschreibung deutsch",  name: beschreibung_de, widget: string, required: false }
                      - { label: "Beschreibung englisch", name: beschreibung_en, widget: string, required: false }
                      - label: "Allergene und Zusatzstoffe"
                        name: allergene
                        widget: string
                        required: false
                        hint: "Nur die Kürzel, mit Komma getrennt, ohne Klammern. Beispiel: A,B,7"
                      - { label: "Vegetarisch", name: vegetarisch, widget: boolean, default: false }
                      - label: "Preis"
                        name: preis
                        widget: string
                        hint: "Nur die Zahl mit Komma, ohne Eurozeichen. Beispiel: 12,50"
                      - label: "Zweiter Preis"
                        name: preis_zweit
                        widget: string
                        required: false
                        hint: "Nur ausfüllen, wenn es zwei Größen gibt, z. B. bei Jamón Serrano / Ibérico. Sonst leer lassen."

                  # ── Getränk ──────────────────────────────────────────────
                  - label: "Getränk"
                    name: getraenk
                    summary: "{{fields.name}}  {{fields.menge}}  ·  {{fields.preis}} €"
                    fields:
                      - label: "Name"
                        name: name
                        widget: string
                        hint: "Stehen auf einer Zeile zwei Produkte mit unterschiedlichen Kürzeln, schreib die Kürzel direkt in Klammern hinter das jeweilige Produkt, z. B. Coca-Cola (1,3,4,*), Limo, Orangenlimo (1,3). Das Feld Allergene bleibt dann leer."
                      - label: "Allergene und Zusatzstoffe"
                        name: allergene
                        widget: string
                        required: false
                        hint: "Nur die Kürzel, mit Komma getrennt, ohne Klammern. Beispiel: 1,3,4,*"
                      - label: "Menge"
                        name: menge
                        widget: string
                        required: false
                        hint: "Beispiel: 0,25 l oder 4 cl"
                      - label: "Preis"
                        name: preis
                        widget: string
                        hint: "Nur die Zahl mit Komma, ohne Eurozeichen. Beispiel: 3,70"

                  # ── Wein ─────────────────────────────────────────────────
                  - label: "Wein"
                    name: wein
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - label: "Allergene und Zusatzstoffe"
                        name: allergene
                        widget: string
                        required: false
                        hint: "Nur die Kürzel, mit Komma getrennt, ohne Klammern. Beispiel: 3"
                      - { label: "Beschreibung", name: beschreibung_de, widget: text, required: false }
                      - label: "Preise nach Menge"
                        name: preise
                        label_singular: "Größe"
                        widget: list
                        fields:
                          - { label: "Menge", name: menge, widget: string, hint: "Beispiel: 0,2 l" }
                          - { label: "Preis", name: preis, widget: string, hint: "Beispiel: 6,00" }

                  # ── Zwischenüberschrift ──────────────────────────────────
                  - label: "Zwischenüberschrift"
                    name: ueberschrift
                    summary: "▸ {{fields.text}}"
                    fields:
                      - label: "Text"
                        name: text
                        widget: string
                        hint: "Kleine Überschrift innerhalb einer Sektion, z. B. Bier · Beer oder Rotwein · Red wine"

                  # ── Spaltenwechsel ──────────────────────────────────────
                  - label: "Spaltenwechsel"
                    name: spaltenwechsel
                    summary: "── ab hier rechte Spalte ──"
                    fields:
                      - label: "Hinweis"
                        name: hinweis
                        widget: string
                        required: false
                        default: "Ab hier beginnt die rechte Spalte."
                        hint: "Nur bei zweispaltigen Sektionen sinnvoll. Erzeugt keinen sichtbaren Text auf der Website."
